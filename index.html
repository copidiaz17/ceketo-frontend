<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F7F1E6" />
    <meta name="description" content="CEKETO - Tienda de alimentos cetogénicos. Viví, Sentí, Comé." />
    <title>CEKETO | Alimentos Cetogénicos</title>
    <!-- Dirección oficial (la de Render sigue andando, pero Google tiene que indexar esta) -->
    <link rel="canonical" href="https://ceketo.com.ar/" />
    <!-- Vista previa al compartir el link (WhatsApp, Instagram, Facebook) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CEKETO" />
    <meta property="og:url" content="https://ceketo.com.ar/" />
    <meta property="og:title" content="CEKETO | Alimentos Cetogénicos" />
    <meta property="og:description" content="Panes, budines, dulces y pastas keto artesanales. Sin azúcar, sin culpas. Viví, Sentí, Comé." />
    <meta property="og:image" content="https://ceketo.com.ar/marca/og-ceketo.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin />
    <link rel="dns-prefetch" href="https://res.cloudinary.com" />
    <!-- Tipografías de la marca (autohospedadas) -->
    <link rel="preload" href="/fonts/cherione.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/comodo.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Poppins: texto de la tienda. Mirza + Inter + Comodo (cdnfonts) siguen para el panel admin -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Mirza:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <link href="https://fonts.cdnfonts.com/css/comodo" rel="stylesheet" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
